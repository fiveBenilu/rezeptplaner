<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rezepte">
  <meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
  <title>Rezeptplaner</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Rezepte</h1>
    <div id="topaction"></div>
  </header>

  <main>
    <!-- Tab: Rezepte -->
    <section id="tab-recipes" class="tab active">
      <details class="card gen" id="gen">
        <summary><span class="gen-summary-icon" data-icon="sparkles"></span><span>Neue Rezeptideen generieren</span></summary>
        <form id="gen-form">
          <label>Küche / Stil
            <input name="cuisine" placeholder="z.B. italienisch, asiatisch">
          </label>
          <div class="row">
            <label>Portionen
              <input name="servings" type="number" min="1" max="12" value="2" inputmode="numeric">
            </label>
            <label>Max. Zeit (Min)
              <input name="max_time_min" type="number" min="5" max="600" step="5" placeholder="egal" inputmode="numeric">
            </label>
          </div>
          <div class="row">
            <label>Ernährung
              <select name="diet">
                <option value="">keine Einschränkung</option>
                <option value="vegetarisch">vegetarisch</option>
                <option value="vegan">vegan</option>
              </select>
            </label>
            <label>Anzahl
              <select name="count">
                <option>3</option><option selected>5</option><option>8</option>
              </select>
            </label>
          </div>
          <label>Freier Wunsch
            <textarea name="wish" rows="2" placeholder="z.B. schnell, wenig Aufwand, viel Gemüse"></textarea>
          </label>
          <button class="btn primary" type="submit">Generieren</button>
          <p class="hint" id="gen-status" role="status"></p>
        </form>
      </details>
      <div id="recipe-filter" class="filter" hidden>
        <div class="row search-row">
          <input id="search" type="search" placeholder="Suchen: Titel, Tag, Küche" aria-label="Rezepte durchsuchen" autocomplete="off">
          <select id="max-time" aria-label="Maximale Zeit">
            <option value="">Zeit: egal</option>
            <option value="15">bis 15 Min</option>
            <option value="30">bis 30 Min</option>
            <option value="60">bis 60 Min</option>
          </select>
        </div>
        <div class="chips" id="chips" role="group" aria-label="Filter"></div>
      </div>
      <div id="recipe-grid" class="grid"></div>
    </section>

    <!-- Tab: Wochenplan -->
    <section id="tab-plan" class="tab">
      <p class="sub" id="plan-week"></p>
      <div id="plan-list"></div>
      <div id="auto-plan" hidden>
        <button class="btn primary" id="auto-open" type="button"><span class="btn-icon" data-icon="sparkles"></span>Woche automatisch planen</button>
        <form id="auto-form" class="card auto-form" hidden>
          <div class="row">
            <label>Anzahl Gerichte
              <select name="count">
                <option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option>
                <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
              </select>
            </label>
            <label>Ernährung
              <select name="diet">
                <option value="">keine Einschränkung</option>
                <option value="vegetarisch">vegetarisch</option>
                <option value="vegan">vegan</option>
              </select>
            </label>
          </div>
          <label>Freier Wunsch
            <textarea name="wish" rows="2" maxlength="500" placeholder="z.B. schnell, wenig Aufwand, viel Gemüse"></textarea>
          </label>
          <button class="btn primary" type="submit">Rezepte generieren &amp; einplanen</button>
          <p class="hint" id="auto-status" role="status"></p>
        </form>
      </div>
      <button class="btn danger" id="new-week">Neue Woche starten</button>
    </section>

    <!-- Tab: Einkaufsliste -->
    <section id="tab-shopping" class="tab">
      <p class="sub" id="shop-week"></p>
      <div id="shop-list"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-tab="recipes" class="active"><span class="ico" data-icon="book"></span>Rezepte</button>
    <button data-tab="plan"><span class="ico" data-icon="calendar"></span>Wochenplan</button>
    <button data-tab="shopping"><span class="ico" data-icon="cart"></span>Einkaufsliste</button>
  </nav>

  <!-- Detailansicht als Sheet -->
  <dialog id="detail"></dialog>
  <div id="toast" role="alert"></div>

  <script src="/static/app.js"></script>
</body>
</html>
